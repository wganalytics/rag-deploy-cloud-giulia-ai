<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 680 860"
  width="2040" height="2580"
  role="img"
  style="font-family: 'Inter', 'Segoe UI', sans-serif; background: #0f1117;">

  <title>PRJ-09 Deploy Cloud (Containerização) — GIULIA AI Engineering Ecosystem</title>
  <desc>Arquitetura de Containerização e Orquestração Multi-Serviços: Internet → Load Balancer / Nginx → Streamlit Portal UI Container ➔ FastAPI Engine Container ➔ ChromaDB &amp; Ollama Container Services</desc>

  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="var(--arr-color, #4a5568)"/>
    </marker>

    <!-- Glow filter for central database and engine -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    :root {
      --bg: #0f1117;
      --surface: #161b27;
      --border-primary: rgba(255,255,255,0.15);
      --border-secondary: rgba(255,255,255,0.08);
      --border-tertiary: rgba(255,255,255,0.05);
      --text-primary: #e8eaf0;
      --text-secondary: #8892a4;
    }

    .th {
      fill: #e8eaf0;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .ts {
      fill: #8892a4;
      font-size: 10px;
      font-weight: 400;
    }
    .arr {
      stroke-width: 1.2;
      fill: none;
    }

    /* Node colors following standard convention */
    .c-gray  rect { fill: #1e2330; stroke: rgba(148,163,184,0.4); }
    .c-teal  rect { fill: #0d2d2d; stroke: rgba( 45,212,191,0.45); }
    .c-purple rect { fill: #1e1530; stroke: rgba(139,92, 246,0.5); }
    .c-blue  rect { fill: #0d1e3d; stroke: rgba( 59,130,246,0.6); }
    .c-amber rect { fill: #2d1f00; stroke: rgba(245,158, 11,0.5); }
    .c-coral rect { fill: #2d1010; stroke: rgba(239, 68, 68,0.5); }
    .c-green rect { fill: #0d2d1a; stroke: rgba( 34,197, 94,0.5); }

    .c-gray  .th { fill: #94a3b8; }
    .c-teal  .th { fill: #2dd4bf; }
    .c-purple .th { fill: #a78bfa; }
    .c-blue  .th { fill: #60a5fa; }
    .c-amber .th { fill: #fbbf24; }
    .c-coral .th { fill: #f87171; }
    .c-green .th { fill: #4ade80; }

    /* Hover effect */
    .node { cursor: pointer; transition: opacity 0.2s; }
    .node:hover { opacity: 0.82; }
    .node:hover rect { stroke-width: 1.5 !important; }

    /* Arrow colors per flow */
    .arr-gray   { stroke: rgba(148,163,184,0.4); }
    .arr-teal   { stroke: rgba( 45,212,191,0.4); }
    .arr-purple { stroke: rgba(139, 92,246,0.4); }
    .arr-blue   { stroke: rgba( 59,130,246,0.5); }
    .arr-green  { stroke: rgba( 34,197, 94,0.4); }
    .arr-amber  { stroke: rgba(245, 158, 11, 0.4); }
    .arr-coral  { stroke: rgba(239, 68, 68, 0.4); }

    /* Phase labels */
    .phase-label {
      fill: rgba(255,255,255,0.3);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
  </style>

  <!-- BACKGROUND PANEL -->
  <rect width="680" height="860" fill="#0f1117"/>

  <!-- Header -->
  <rect x="0" y="0" width="680" height="56" fill="#0d1117"/>
  <text x="340" y="24" text-anchor="middle" dominant-baseline="central"
    font-size="13" font-weight="700" fill="#e8eaf0">
    PRJ-09 · Deploy Cloud (Containerização)
  </text>
  <text x="340" y="44" text-anchor="middle" dominant-baseline="central"
    font-size="10" fill="#60a5fa" letter-spacing="2">
    DOCKER COMPOSE · UNIFIED PORTAL · FASTAPI BACKEND · OLLAMA CLUSTERING
  </text>

  <!-- ══════════════════════════════════════════════════
       FASE 1: ENTRYPOINT & REVERSE PROXY
  ══════════════════════════════════════════════════ -->
  <text class="phase-label" x="40" y="88">FASE 1: ROTEAMENTO E ENTRADA DE TRÁFEGO</text>
  <line x1="40" y1="96" x2="640" y2="96" stroke="rgba(255,255,255,0.05)" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- Node: Internet Users -->
  <g class="node c-amber" onclick="sendPrompt('Como o tráfego externo é recebido no deploy do ecossistema?')">
    <rect x="40" y="115" width="160" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="120" y="135" text-anchor="middle" dominant-baseline="central">🌐 Tráfego Externo (Internet)</text>
    <text class="ts" x="120" y="154" text-anchor="middle" dominant-baseline="central">Porta HTTP 80 / HTTPS 443</text>
  </g>

  <!-- Arrow: Internet -> Proxy -->
  <line x1="200" y1="141" x2="258" y2="141" class="arr arr-gray" marker-end="url(#arrow)"/>

  <!-- Node: Reverse Proxy / Nginx -->
  <g class="node c-teal" onclick="sendPrompt('Como o Nginx atua como proxy reverso e balanceador de carga entre a UI e a API?')">
    <rect x="260" y="115" width="180" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="350" y="135" text-anchor="middle" dominant-baseline="central">🔀 Nginx / Load Balancer</text>
    <text class="ts" x="350" y="154" text-anchor="middle" dominant-baseline="central">Roteamento de subdomínios/portas</text>
  </g>

  <!-- Split paths from proxy -->
  <path d="M 440 141 L 490 141 L 490 220 L 460 220" class="arr arr-teal" marker-end="url(#arrow)"/>

  <!-- ══════════════════════════════════════════════════
       FASE 2: UNIFIED FRONTEND PORTAL
  ══════════════════════════════════════════════════ -->
  <text class="phase-label" x="40" y="200">FASE 2: PORTAL UNIFICADO (STREAMLIT PORTAL)</text>
  <line x1="40" y1="208" x2="640" y2="208" stroke="rgba(255,255,255,0.05)" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- Node: Portal Container -->
  <g class="node c-purple" filter="url(#glow)" onclick="sendPrompt('O que é o Portal Unificado e como ele centraliza o acesso a todos os projetos de RAG (PRJ-01 a PRJ-08)?')">
    <rect x="200" y="220" width="260" height="62" rx="10" stroke-width="1.5"/>
    <text class="th" x="330" y="242" text-anchor="middle" dominant-baseline="central">🖥️ Container: Streamlit Portal</text>
    <text class="ts" x="330" y="263" text-anchor="middle" dominant-baseline="central">Serviço: portal_app · Porta 8501</text>
    <text class="ts" x="330" y="273" text-anchor="middle" dominant-baseline="central">Interface unificada de seleção de engines</text>
  </g>

  <!-- ══════════════════════════════════════════════════
       FASE 3: BACKEND API SERVICE
  ══════════════════════════════════════════════════ -->
  <text class="phase-label" x="40" y="325">FASE 3: BACKEND API &amp; ORQUESTRAÇÃO</text>
  <line x1="40" y1="333" x2="640" y2="333" stroke="rgba(255,255,255,0.05)" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- Arrow from Frontend to Backend API -->
  <line x1="330" y1="282" x2="330" y2="350" class="arr arr-purple" marker-end="url(#arrow)"/>

  <!-- Node: FastAPI Backend Container -->
  <g class="node c-blue" onclick="sendPrompt('Qual o papel do container FastAPI na centralização de rotas e comunicação interna?')">
    <rect x="210" y="350" width="240" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="330" y="370" text-anchor="middle" dominant-baseline="central">⚙️ Container: FastAPI Engine</text>
    <text class="ts" x="330" y="389" text-anchor="middle" dominant-baseline="central">Serviço: backend_api · Porta 8000</text>
  </g>

  <!-- ══════════════════════════════════════════════════
       FASE 4: CLUSTERING & PERSISTENCE LAYER
  ══════════════════════════════════════════════════ -->
  <text class="phase-label" x="40" y="445">FASE 4: CAMADA DE SERVIÇOS E PERSISTÊNCIA</text>
  <line x1="40" y1="453" x2="640" y2="453" stroke="rgba(255,255,255,0.05)" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- Split arrows from API to services -->
  <path d="M 210 376 L 120 376 L 120 480" class="arr arr-blue" marker-end="url(#arrow)"/>
  <path d="M 330 402 L 330 480" class="arr arr-blue" marker-end="url(#arrow)"/>
  <path d="M 450 376 L 540 376 L 540 480" class="arr arr-blue" marker-end="url(#arrow)"/>

  <!-- Node: Vector DB Service -->
  <g class="node c-teal" onclick="sendPrompt('Como o ChromaDB é orquestrado em container independente com volumes de dados persistentes?')">
    <rect x="30" y="480" width="180" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="120" y="500" text-anchor="middle" dominant-baseline="central">📦 Container: ChromaDB</text>
    <text class="ts" x="120" y="519" text-anchor="middle" dominant-baseline="central">Serviço: chromadb · Porta 8000</text>
  </g>

  <!-- Node: Memory / Caching Service -->
  <g class="node c-purple" onclick="sendPrompt('Como o Redis gerencia o cache e o histórico de memória do ecossistema?')">
    <rect x="240" y="480" width="180" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="330" y="500" text-anchor="middle" dominant-baseline="central">⚡ Container: Redis Memory</text>
    <text class="ts" x="330" y="519" text-anchor="middle" dominant-baseline="central">Serviço: redis · Porta 6379</text>
  </g>

  <!-- Node: Ollama Service -->
  <g class="node c-coral" onclick="sendPrompt('Como o Ollama é configurado para rodar localmente com aceleração de GPU dentro do Docker?')">
    <rect x="450" y="480" width="180" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="540" y="500" text-anchor="middle" dominant-baseline="central">🤖 Container: Ollama API</text>
    <text class="ts" x="540" y="519" text-anchor="middle" dominant-baseline="central">Serviço: ollama · Porta 11434</text>
  </g>

  <!-- ══════════════════════════════════════════════════
       FASE 5: CLOUD DEPLOY (AWS / OCI)
  ══════════════════════════════════════════════════ -->
  <text class="phase-label" x="40" y="585">FASE 5: DEPLOY CLOUD &amp; SEGURANÇA</text>
  <line x1="40" y1="593" x2="640" y2="593" stroke="rgba(255,255,255,0.05)" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- Arrows from all Services to Cloud -->
  <path d="M 120 532 L 120 620 L 238 620" class="arr arr-teal" marker-end="url(#arrow)"/>
  <path d="M 330 532 L 330 600" class="arr arr-purple" marker-end="url(#arrow)"/>
  <path d="M 540 532 L 540 620 L 422 620" class="arr arr-coral" marker-end="url(#arrow)"/>

  <!-- Node: Docker Compose Orchestrator -->
  <g class="node c-green" onclick="sendPrompt('Como o arquivo docker-compose.yml amarra a integridade da inicialização do ecossistema?')">
    <rect x="200" y="600" width="260" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="330" y="620" text-anchor="middle" dominant-baseline="central">🐋 Docker Compose Orchestrator</text>
    <text class="ts" x="330" y="639" text-anchor="middle" dominant-baseline="central">Isolamento de Redes e Volumes persistentes</text>
  </g>

  <!-- Arrow from Compose to AWS -->
  <line x1="330" y1="652" x2="330" y2="710" class="arr arr-green" marker-end="url(#arrow)"/>

  <!-- Node: Cloud Cluster (AWS/OCI) -->
  <g class="node c-blue" onclick="sendPrompt('Como o ecossistema é implantado em produção em instâncias GPU na Nuvem?')">
    <rect x="160" y="710" width="340" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="330" y="730" text-anchor="middle" dominant-baseline="central">☁️ Infraestrutura Cloud (AWS / OCI)</text>
    <text class="ts" x="330" y="749" text-anchor="middle" dominant-baseline="central">Deployment elástico com CI/CD, HTTPS seguro e persistência</text>
  </g>

  <!-- ══════════════════════════════════════════════════
       FOOTER — METRICS
  ══════════════════════════════════════════════════ -->
  <rect x="40" y="790" width="600" height="24" rx="4"
    fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <text class="ts" x="340" y="802" text-anchor="middle" dominant-baseline="central" opacity="0.7">
    Métricas Reais: 7 arquivos de deployment · 483 linhas de config · Epic GARE-99 Done
  </text>

  <script type="text/javascript">
    function sendPrompt(msg) {
      if (window.parent &amp;&amp; window.parent.postMessage) {
        window.parent.postMessage({ type: 'sendPrompt', content: msg }, '*');
      }
      console.log('[GIULIA Diagram] Prompt:', msg);
    }
  </script>
</svg>
